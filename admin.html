<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SHREE DEVI TRAVELS MANIPAL - Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#6f8fd8,#234c9c);
    color:white;
}

/* ================= LOGIN ================= */

#loginCard{
    width:370px;
    max-width:92%;
    margin:120px auto 0;
}

.card{
    background:#315fb5;
    padding:35px;
    border-radius:28px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.logo{
    width:100px;
    height:100px;
    margin:-85px auto 20px;
    border-radius:50%;
    overflow:hidden;
    background:white;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand{
    text-align:center;
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.manipal{
    text-align:center;
    color:#dce9ff;
    letter-spacing:7px;
    margin-bottom:30px;
}

h2{
    text-align:center;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

/* LOGIN BUTTON */

.login{
    width:100%;
    background:#dceaff;
    color:#234c9c;
    margin-top:10px;
}

/* ================= DASHBOARD ================= */

#dashboard{
    display:none;
    padding:20px;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.header h1{
    margin:0;
}

.header small{
    font-size:14px;
    opacity:.8;
}

.logout{
    background:#ff4d4d;
    color:white;
}

.container{
    max-width:1200px;
    margin:20px auto;
}

/* ================= TABS ================= */

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    background:#ffffff22;
    color:white;
}

.tab.active{
    background:white;
    color:#234c9c;
}

/* ================= SECTIONS ================= */

.section{
    display:none;
}

.section.active{
    display:block;
}

.panel{
    background:#315fb5;
    padding:25px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    margin-bottom:20px;
}

/* ================= POSTS ================= */

.publish{
    background:#00c968;
    color:white;
    width:100%;
    margin-top:10px;
}

/* ================= CUSTOMERS ================= */

.customer-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:15px;

    margin-top:20px;
}

.customer{
    background:white;
    color:#222;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.customer h3{
    margin-top:0;
    color:#234c9c;
}

.customer p{
    margin:7px 0;
}

.customer-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.feedback-btn{
    background:#ff9800;
    color:white;
}

.edit{
    background:#3478db;
    color:white;
}

.delete{
    background:#ef4444;
    color:white;
}

/* ================= SAVE ================= */

.save{
    background:#00c968;
    color:white;
    width:100%;
    margin-top:10px;
}

.cancel{
    background:#777;
    color:white;
    width:100%;
    margin-top:10px;
}

.search{
    margin-bottom:10px;
}

.status{
    font-weight:bold;
}

.on{
    color:green;
}

.off{
    color:red;
}

.small{
    font-size:13px;
    opacity:.8;
}

.success{
    text-align:center;
    color:#baffd2;
    font-weight:bold;
    margin-top:10px;
}

/* ================= FEEDBACK ================= */

.feedback-preview{
    background:white;
    color:#222;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    line-height:1.6;
    white-space:pre-line;
}

.feedback-title{
    color:#234c9c;
    font-weight:bold;
    margin-bottom:10px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    #loginCard{
        margin-top:110px;
    }

    .card{
        padding:25px;
    }

    .header h1{
        font-size:21px;
    }

    .tabs{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .tab{
        width:100%;
    }

}

</style>

</head>

<body>

<!-- ================================================= -->

<!-- ================================================= -->
<!-- DASHBOARD -->
<!-- ================================================= -->

<div id="dashboard">

    <div class="header">

        <h1>

            SHREE DEVI TRAVELS

            <small>
                ADMIN

        </h1>

        <button
        class="logout"
        onclick="logout()">

    </div>


    <div class="container">

        <!-- TABS -->

                <h2>

<!-- FIREBASE -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================================================= */
/* FIREBASE CONFIG */
/* ================================================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyAhjwzCxbJGCH9gugYwOSi1y8a_KMF9i4A",

    authDomain:
    "shree-devi-travels-cab-manipal.firebaseapp.com",

    projectId:
    "shree-devi-travels-cab-manipal",

    storageBucket:
    "shree-devi-travels-cab-manipal.firebasestorage.app",

    messagingSenderId:
    "1053219618665",

    appId:
    "1:1053219618665:web:8425445106e1b3e494c7f8"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* ================================================= */
/* LOGIN */
/* ================================================= */


window.login = async function(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    if(!email || !password){

        alert(
        "Enter Email and Password"
        );

        return;

    }


    try{

        await signInWithEmailAndPassword(

            auth,
            email,
            password

        );

    }

    catch(error){

        console.error(error);

        document
        .getElementById("loginError")
        .innerHTML =

        "<p style='color:#ffd1d1;text-align:center'>" +

        "❌ " +
        error.code +

        "</p>";

    }

};



/* ================================================= */
/* AUTH STATE */
/* ================================================= */


onAuthStateChanged(
auth,
(user)=>{

    if(user){

        document
        .getElementById("loginCard")
        .style.display="none";


        document
        .getElementById("dashboard")
        .style.display="block";


        loadCustomers();

    }

    else{

        document
        .getElementById("loginCard")
        .style.display="block";


        document
        .getElementById("dashboard")
        .style.display="none";

    }

});



/* ================================================= */
/* LOGOUT */
/* ================================================= */


window.logout = async function(){

    await signOut(auth);

};



/* ================================================= */
/* TABS */
/* ================================================= */


window.showSection =
function(id,button){

    document
    .querySelectorAll(".section")
    .forEach(section=>{

        section
        .classList
        .remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        tab
        .classList
        .remove("active");

    });


    document
    .getElementById(id)
    .classList
    .add("active");


    button
    .classList
    .add("active");


    if(id==="feedback"){

        loadFeedbackCustomers();

    }

};



/* ================================================= */
/* ADD POST */
/* ================================================= */


window.addPost =
async function(){

    const title =
    document
    .getElementById("title")
    .value
    .trim();


    const content =
    document
    .getElementById("content")
    .value
    .trim();


    if(!title || !content){

        alert(
        "Enter Post Title and Content"
        );

        return;

    }


    try{

        await addDoc(

            collection(
            db,
            "news"
            ),

            {

                title:title,

                content:content,

                image:"offer.jpg",

                createdAt:
                serverTimestamp()

            }

        );


        document
        .getElementById("postMsg")
        .innerHTML =

        "✅ Post Published Successfully";


        document
        .getElementById("title")
        .value="";


        document
        .getElementById("content")
        .value="";

    }

    catch(error){

        alert(error.message);

    }

};



/* ================================================= */
/* CUSTOMER VARIABLES */
/* ================================================= */


let customers = [];

let editingCustomerId = null;



/* ================================================= */
/* SAVE CUSTOMER */
/* ================================================= */


window.saveCustomer =
async function(){

    const name =
    document
    .getElementById("customerName")
    .value
    .trim();


    let phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();


    const pickupLocation =
    document
    .getElementById("pickupLocation")
    .value
    .trim();


    const dropLocation =
    document
    .getElementById("dropLocation")
    .value
    .trim();


    const travelDate =
    document
    .getElementById("travelDate")
    .value;


    const vehicle =
    document
    .getElementById("vehicle")
    .value
    .trim();


    const reminder =
    document
    .getElementById("reminder")
    .value === "true";


    if(!name || !phone){

        alert(
        "Customer Name and WhatsApp Number are required"
        );

        return;

    }


    phone =
    phone.replace(/\D/g,"");


    if(phone.length===10){

        phone =
        "91" + phone;

    }


    if(phone.length<11){

        alert(
        "Enter valid WhatsApp number"
        );

        return;

    }


    const data = {

        name:name,

        phone:phone,

        pickupLocation:
        pickupLocation,

        dropLocation:
        dropLocation,

        travelDate:
        travelDate,

        vehicle:
        vehicle,

        reminder:
        reminder,

        updatedAt:
        serverTimestamp()

    };


    try{

        if(editingCustomerId){

            await updateDoc(

                doc(
                db,
                "customers",
                editingCustomerId
                ),

                data

            );


            document
            .getElementById("customerMsg")
            .innerHTML =

            "✅ Customer Updated Successfully";

        }

        else{

            await addDoc(

                collection(
                db,
                "customers"
                ),

                {

                    ...data,

                    createdAt:
                    serverTimestamp()

                }

            );


            document
            .getElementById("customerMsg")
            .innerHTML =

            "✅ Customer Added Successfully";

        }


        clearCustomerForm();

        await loadCustomers();

    }

    catch(error){

        alert(error.message);

    }

};



/* ================================================= */
/* LOAD CUSTOMERS */
/* ================================================= */


async function loadCustomers(){

    try{

        const snapshot =

        await getDocs(

            collection(
            db,
            "customers"
            )

        );


        customers=[];


        snapshot.forEach(item=>{

            customers.push({

                id:item.id,

                ...item.data()

            });

        });


        displayCustomers(customers);

        loadFeedbackCustomers();

    }

    catch(error){

        console.error(error);


        document
        .getElementById("customerGrid")
        .innerHTML =

        "<p>Unable to load customers.</p>";

    }

}



/* ================================================= */
/* DISPLAY CUSTOMERS */
/* ================================================= */


function displayCustomers(list){

    const grid =
    document
    .getElementById("customerGrid");


    document
    .getElementById("customerCount")
    .innerText =

    "Total Customers: " +
    list.length;


    grid.innerHTML="";


    if(list.length===0){

        grid.innerHTML =
        "<p>No customers found.</p>";

        return;

    }


    list.forEach(customer=>{

        const div =
        document
        .createElement("div");


        div.className="customer";


        const reminderText =

        customer.reminder

        ?

        "<span class='status on'>ON</span>"

        :

        "<span class='status off'>OFF</span>";


        div.innerHTML = `

            <h3>
                👤
                ${escapeHTML(
                customer.name || ""
                )}
            </h3>

            <p>
                📱
                ${escapeHTML(
                customer.phone || ""
                )}
            </p>

            <p>
                📍 Pickup:
                ${escapeHTML(
                customer.pickupLocation ||
                "Not added"
                )}
            </p>

            <p>
                📍 Drop:
                ${escapeHTML(
                customer.dropLocation ||
                "Not added"
                )}
            </p>

            <p>
                📅 Travel:
                ${escapeHTML(
                customer.travelDate ||
                "Not added"
                )}
            </p>

            <p>
                🚕
                ${escapeHTML(
                customer.vehicle ||
                "Not added"
                )}
            </p>

            <p>
                🔔 Monthly Reminder:
                ${reminderText}
            </p>


            <div class="customer-buttons">


                <button
                class="whatsapp"

                onclick="openWhatsApp(
                '${customer.phone}',
                '${escapeHTML(
                customer.name || ""
                )}'
                )">

                    💬 WhatsApp

                </button>


                <button
                class="feedback-btn"

                onclick="openFeedbackForCustomer(
                '${customer.id}'
                )">

                    📝 Feedback

                </button>


                <button
                class="edit"

                onclick="editCustomer(
                '${customer.id}'
                )">

                    ✏️ Edit

                </button>


                <button
                class="delete"

                onclick="deleteCustomer(
                '${customer.id}'
                )">

                    🗑️ Delete

                </button>


            </div>

        `;


        grid.appendChild(div);

    });

}



/* ================================================= */
/* NORMAL WHATSAPP */
/* ================================================= */


window.openWhatsApp =
function(phone,customerName){

`Greetings from SHREE DEVI TRAVELS MANIPAL 🚖✨

📞 6362635718

Thank you for choosing SHREE DEVI TRAVELS MANIPAL. 🙏

Your Journey, Our Responsibility.`;

    "https://wa.me/" +

/* ================================================= */
/* FEEDBACK CUSTOMER LIST */
/* ================================================= */


function loadFeedbackCustomers(){

    const select =
    document
    .getElementById(
    "feedbackCustomer"
    );


    if(!select) return;


    select.innerHTML =

    '<option value="">Select Customer</option>';


    customers.forEach(customer=>{

        const option =
        document.createElement("option");


        option.value =
        customer.id;


        option.textContent =

        customer.name +

        " - " +

        (
        customer.phone || ""
        );


        select.appendChild(option);

    });

}



/* ================================================= */
/* OPEN FEEDBACK FOR CUSTOMER */
/* ================================================= */


window.openFeedbackForCustomer =
function(id){

    const customer =
    customers.find(
    item=>item.id===id
    );


    if(!customer) return;


    showFeedbackTab();


    document
    .getElementById(
    "feedbackCustomer"
    )
    .value=id;


    previewFeedback();

};



/* ================================================= */
/* SHOW FEEDBACK TAB */
/* ================================================= */


function showFeedbackTab(){

    document
    .querySelectorAll(".section")
    .forEach(section=>{

        section
        .classList
        .remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        tab
        .classList
        .remove("active");

    });


    document
    .getElementById("feedback")
    .classList
    .add("active");


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        if(
        tab.textContent.includes(
        "Feedback"
        )
        ){

            tab.classList.add(
            "active"
            );

        }

    });

}



/* ================================================= */
/* FEEDBACK PREVIEW */
/* ================================================= */


window.previewFeedback =
function(){

    const id =
    document
    .getElementById(
    "feedbackCustomer"
    )
    .value;


    const preview =
    document
    .getElementById(
    "feedbackPreview"
    );


    if(!id){

        preview.style.display="none";

    }

    customers.find(

    );

    customer.dropLocation ||

    const message =

`Greetings from SHREE DEVI TRAVELS, MANIPAL. 🚖

Dear ${customer.name},

Thank you for choosing SHREE DEVI TRAVELS, MANIPAL. We truly appreciate your trust and support, and we look forward to serving you again on your future journeys.

Warm Regards,
SHREE DEVI TRAVELS, MANIPAL Team

📞 +91 6362635718 / +91 7019849902
📧 shreedevitravelsofficial@gmail.com
🌐 https://shreedevitravels.github.io/Shree_devi_travels_manipal/`;


    preview.innerText=message;

window.editCustomer =
function(id){

    const customer =
    customers.find(
    item=>item.id===id
    );


    if(!customer) return;


    editingCustomerId=id;


    document
    .getElementById(
    "customerFormTitle"
    )
    .innerText =
    "✏️ EDIT CUSTOMER";


    document
    .getElementById(
    "customerName"
    )
    .value =
    customer.name || "";


    document
    .getElementById(
    "customerPhone"
    )
    .value =
    customer.phone || "";


    document
    .getElementById(
    "pickupLocation"
    )
    .value =
    customer.pickupLocation || "";


    document
    .getElementById(
    "dropLocation"
    )
    .value =
    customer.dropLocation || "";


    document
    .getElementById(
    "travelDate"
    )
    .value =
    customer.travelDate || "";


    document
    .getElementById(
    "vehicle"
    )
    .value =
    customer.vehicle || "";


    document
    .getElementById(
    "reminder"
    )
    .value =
    customer.reminder
    ? "true"
    : "false";


    document
    .getElementById(
    "cancelEdit"
    )
    .style.display="block";


    document
    .querySelectorAll(".section")
    .forEach(section=>{

        section
        .classList
        .remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        tab
        .classList
        .remove("active");

    });


    document
    .getElementById(
    "addCustomer"
    )
    .classList
    .add("active");


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        if(
        tab.textContent.includes(
        "Add Customer"
        )
        ){

            tab.classList.add(
            "active"
            );

        }

    });

};

window.deleteCustomer =
async function(id){

    const yes =
    confirm(
    "Delete this customer permanently?"
    );


    if(!yes) return;


    try{

        await deleteDoc(

            doc(
            db,
            "customers",
            id
            )

        );


        await loadCustomers();


        alert(
        "Customer deleted"
        );

    }

    catch(error){

        alert(
        error.message
        );

    }

};

window.searchCustomers =
function(){

    const value =
    document
    .getElementById(
    "searchCustomer"
    )
    .value
    .toLowerCase()
    .trim();


    const filtered =

    customers.filter(
    customer=>

        (customer.name || "")
        .toLowerCase()
        .includes(value)

        ||

        (customer.phone || "")
        .includes(value)

        ||

        (customer.pickupLocation || "")
        .toLowerCase()
        .includes(value)

        ||

        (customer.dropLocation || "")
        .toLowerCase()
        .includes(value)

    );


    displayCustomers(
    filtered
    );

};

/* ================================================= */
/* HTML SECURITY */
/* ================================================= */


function escapeHTML(value){

    return String(value)

    .replace(
    /&/g,
    "&amp;"
    )

    .replace(
    /</g,
    "&lt;"
    )

    .replace(
    />/g,
    "&gt;"
    )

    .replace(
    /"/g,
    "&quot;"
    )

    .replace(
    /'/g,
    "&#039;"
    );

}
