<script type="module">


/* ================================================= */
/* FIREBASE IMPORTS */
/* ================================================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* ================================================= */
/* FIREBASE CONFIG */
/* ================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAhjwzCxbJGCH9gugYwOSi1y8a_KMF9i4A",

    authDomain:
    "shree-devi-travels-cab-manipal.firebaseapp.com",

    projectId:
    "shree-devi-travels-cab-manipal",

    storageBucket:
    "shree-devi-travels-cab-manipal.firebasestorage.app",

    messagingSenderId:
    "1053219618665",

    appId:
    "1:1053219618665:web:8425445106e1b3e494c7f8"

};


/* ================================================= */
/* INITIALIZE */
/* ================================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);


/* ================================================= */
/* GLOBAL VARIABLES */
/* ================================================= */

let customers = [];

let editingCustomerId = null;


/* ================================================= */
/* LOGIN */
/* ================================================= */

window.login = async function(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value;

    const errorBox =
    document
    .getElementById("loginError");

    const button =
    document
    .getElementById("loginButton");


    errorBox.innerHTML="";


    if(!email || !password){

        errorBox.innerHTML =
        "⚠️ Enter email and password.";

        return;

    }


    button.disabled=true;

    button.innerText="⏳ Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        console.error(error);


        let message =
        "Login failed.";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
            "❌ Invalid email or password.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
            "❌ Admin account not found.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            message =
            "❌ Incorrect password.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            message =
            "⚠️ Too many attempts. Try again later.";

        }

        else{

            message =
            "❌ " + error.message;

        }


        errorBox.innerHTML =
        message;

    }

    finally{

        button.disabled=false;

        button.innerText="🔐 LOGIN";

    }

};


/* ================================================= */
/* AUTH STATE */
/* ================================================= */

onAuthStateChanged(
auth,
async(user)=>{

    if(user){

        document
        .getElementById("loginCard")
        .style.display="none";


        document
        .getElementById("dashboard")
        .style.display="block";


        await loadCustomers();

    }

    else{

        document
        .getElementById("loginCard")
        .style.display="block";


        document
        .getElementById("dashboard")
        .style.display="none";

    }

});


/* ================================================= */
/* LOGOUT */
/* ================================================= */

window.logout = async function(){

    try{

        await signOut(auth);

    }

    catch(error){

        alert(
            "Logout failed: " +
            error.message
        );

    }

};


/* ================================================= */
/* TABS */
/* ================================================= */

window.showSection =
function(id,button){

    document
    .querySelectorAll(".section")
    .forEach(section=>{

        section
        .classList
        .remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        tab
        .classList
        .remove("active");

    });


    const section =
    document.getElementById(id);


    if(section){

        section.classList.add("active");

    }


    if(button){

        button.classList.add("active");

    }


    if(id==="feedback"){

        loadFeedbackCustomers();

    }

};


/* ================================================= */
/* IMAGE PREVIEW */
/* ================================================= */

window.previewImage =
function(event){

    const file =
    event.target.files[0];

    const preview =
    document.getElementById(
        "imagePreview"
    );


    if(!file){

        preview.style.display="none";
        preview.src="";

        return;

    }


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        alert(
            "Please select JPG, PNG or WebP image."
        );

        event.target.value="";

        preview.style.display="none";

        return;

    }


    if(
        file.size >
        10 * 1024 * 1024
    ){

        alert(
            "Image size must be below 10 MB."
        );

        event.target.value="";

        preview.style.display="none";

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        preview.src =
        e.target.result;

        preview.style.display="block";

    };


    reader.readAsDataURL(file);

};


/* ================================================= */
/* ADD POST */
/* ================================================= */

window.addPost =
async function(){

    const title =
    document
    .getElementById("title")
    .value
    .trim();


    const content =
    document
    .getElementById("content")
    .value
    .trim();


    const imageInput =
    document
    .getElementById("image");


    const file =
    imageInput.files[0];


    const progress =
    document
    .getElementById("uploadProgress");


    const message =
    document
    .getElementById("postMsg");


    const button =
    document
    .getElementById("publishButton");


    message.innerHTML="";
    progress.innerHTML="";


    if(!title){

        alert(
            "Please enter post title."
        );

        return;

    }


    if(!content){

        alert(
            "Please enter post content."
        );

        return;

    }


    if(!auth.currentUser){

        alert(
            "Your admin session has expired. Please login again."
        );

        return;

    }


    button.disabled=true;


    try{

        let imageURL="";


        /* IMAGE */

        if(file){

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];


            if(
                !allowedTypes.includes(
                    file.type
                )
            ){

                throw new Error(
                    "Only JPG, PNG and WebP images are allowed."
                );

            }


            if(
                file.size >
                10 * 1024 * 1024
            ){

                throw new Error(
                    "Image size must be below 10 MB."
                );

            }


            progress.innerHTML =
            "⏳ Uploading image...";


            const safeName =
            file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


            const fileName =
            Date.now() +
            "_" +
            safeName;


            const storageRef =
            ref(
                storage,
                "news-images/" +
                fileName
            );


            await uploadBytes(
                storageRef,
                file,
                {
                    contentType:file.type
                }
            );


            imageURL =
            await getDownloadURL(
                storageRef
            );


            progress.innerHTML =
            "✅ Image uploaded.";

        }


        /* FIRESTORE */

        progress.innerHTML =
        "⏳ Publishing post...";


        await addDoc(

            collection(
                db,
                "news"
            ),

            {

                title:title,

                content:content,

                image:imageURL,

                likes:0,

                createdAt:
                serverTimestamp(),

                createdBy:
                auth.currentUser.email || ""

            }

        );


        progress.innerHTML="";

        message.innerHTML =
        "✅ Post Published Successfully";


        /* CLEAR */

        document
        .getElementById("title")
        .value="";


        document
        .getElementById("content")
        .value="";


        imageInput.value="";


        const preview =
        document.getElementById(
            "imagePreview"
        );


        preview.src="";
        preview.style.display="none";

    }

    catch(error){

        console.error(
            "POST ERROR:",
            error
        );


        progress.innerHTML="";


        alert(
            "❌ Upload/Publish failed:\n\n" +
            error.message
        );

    }

    finally{

        button.disabled=false;

    }

};


/* ================================================= */
/* SAVE CUSTOMER */
/* ================================================= */

window.saveCustomer =
async function(){

    const name =
    document
    .getElementById("customerName")
    .value
    .trim();


    let phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();


    const pickupLocation =
    document
    .getElementById("pickupLocation")
    .value
    .trim();


    const dropLocation =
    document
    .getElementById("dropLocation")
    .value
    .trim();


    const travelDate =
    document
    .getElementById("travelDate")
    .value;


    const vehicle =
    document
    .getElementById("vehicle")
    .value
    .trim();


    const reminder =
    document
    .getElementById("reminder")
    .value === "true";


    const message =
    document
    .getElementById("customerMsg");


    message.innerHTML="";


    if(!name){

        alert(
            "Customer name is required."
        );

        return;

    }


    if(!phone){

        alert(
            "WhatsApp number is required."
        );

        return;

    }


    phone =
    phone.replace(/\D/g,"");


    if(phone.length===10){

        phone =
        "91" +
        phone;

    }


    if(
        phone.length !== 12 ||
        !phone.startsWith("91")
    ){

        alert(
            "Please enter a valid Indian WhatsApp number."
        );

        return;

    }


    const data = {

        name:name,

        phone:phone,

        pickupLocation:
        pickupLocation,

        dropLocation:
        dropLocation,

        travelDate:
        travelDate,

        vehicle:
        vehicle,

        reminder:
        reminder,

        updatedAt:
        serverTimestamp()

    };


    try{

        if(editingCustomerId){

            await updateDoc(

                doc(
                    db,
                    "customers",
                    editingCustomerId
                ),

                data

            );


            message.innerHTML =
            "✅ Customer Updated Successfully";

        }

        else{

            await addDoc(

                collection(
                    db,
                    "customers"
                ),

                {

                    ...data,

                    createdAt:
                    serverTimestamp(),

                    createdBy:
                    auth.currentUser.email || ""

                }

            );


            message.innerHTML =
            "✅ Customer Added Successfully";

        }


        clearCustomerForm();

        await loadCustomers();

    }

    catch(error){

        console.error(error);

        alert(
            "Customer save failed:\n\n" +
            error.message
        );

    }

};


/* ================================================= */
/* LOAD CUSTOMERS */
/* ================================================= */

async function loadCustomers(){

    try{

        const snapshot =
        await getDocs(

            collection(
                db,
                "customers"
            )

        );


        customers=[];


        snapshot.forEach(item=>{

            customers.push({

                id:item.id,

                ...item.data()

            });

        });


        displayCustomers(
            customers
        );


        loadFeedbackCustomers();

    }

    catch(error){

        console.error(error);


        document
        .getElementById("customerGrid")
        .innerHTML =
        "<p>❌ Unable to load customers. Check Firebase rules.</p>";

    }

}

function displayCustomers(list){

                📱

            </p>

                📍 Drop:

                    "Not added"
                )}
            </p>

                ${escapeHTML(
                    customer.travelDate ||
                    "Not added"
                )}
            </p>

            <p>
                🚕
                ${escapeHTML(
                    customer.vehicle ||
                    "Not added"
                )}

                🔔 Monthly Reminder:

                <button

function(event){

    button.dataset.id;


    const action =
    button.dataset.action;


    if(!id) return;


    if(action==="whatsapp"){

    if(action==="feedback"){

        openFeedbackForCustomer(id);

    }


    if(action==="edit"){

        editCustomer(id);

    }


    if(action==="delete"){

        deleteCustomer(id);

    }

});

/* ================================================= */
/* FEEDBACK CUSTOMER LIST */
/* ================================================= */

function loadFeedbackCustomers(){

    const select =
    document.getElementById(
        "feedbackCustomer"
    );


    if(!select) return;


    const oldValue =
    select.value;


    select.innerHTML =
    '<option value="">Select Customer</option>';


    customers.forEach(customer=>{

        const option =
        document.createElement(
            "option"
        );


        option.value =
        customer.id;


        option.textContent =
        (
            customer.name ||
            "Unnamed Customer"
        ) +
        " - " +
        (
            customer.phone ||
            ""
        );


        select.appendChild(
            option
        );

    });


    if(
        customers.some(
            c=>c.id===oldValue
        )
    ){

        select.value=oldValue;

    }

}

/* ================================================= */
/* HTML SECURITY */
/* ================================================= */

function escapeHTML(value){

    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
