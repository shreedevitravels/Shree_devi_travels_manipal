<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shree Devi Travels - Clear PDF</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .btn-container {
      margin-bottom: 20px;
    }

    .download-btn {
      padding: 12px 24px;
      background-color: #e5cb80;
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Fixed A4 size layout */
    .form-container {
      width: 750px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 20px;
    }

    .header-banner {
      background: linear-gradient(135deg, #a4bada, #8daed8);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .header-banner i {
      font-size: 28px;
      color: #e2cb83;
      margin-bottom: 6px;
    }

    .header-banner h1 {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .header-banner p {
      font-size: 11px;
      margin-top: 2px;
    }

    .section-card {
      position: relative;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .section-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background-color: #e5cb80;
      border-radius: 4px 0 0 4px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #777;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #888;
      margin-bottom: 3px;
    }

    .form-group input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #e8e8e8;
      background-color: #f9f9f9;
      border-radius: 5px;
      font-size: 11px;
      color: #333;
    }

    /* Print View Improvements (Direct Vector Print) */
    @media print {
      body {
        background-color: #fff;
        padding: 0;
      }
      .btn-container {
        display: none;
      }
      .form-container {
        width: 100%;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="btn-container">
    <button class="download-btn" onclick="downloadCrispPDF()">Download HD PDF</button>
    <button class="download-btn" style="background-color: #fff; margin-left: 10px;" onclick="window.print()">Print Direct (Best Quality)</button>
  </div>

  <div class="form-container" id="pdf-content">
    <div class="header-banner">
      <i class="fa-solid fa-car"></i>
      <h1>Shree Devi Travels Manipal</h1>
      <p>Your Journey, Our Responsibility</p>
    </div>

    <div class="section-card">
      <div class="section-title"><i class="fa-regular fa-file-lines"></i> Quotation Details</div>
      <div class="form-group">
        <label>Quotation Number</label>
        <input type="text" value="SDTM-20260805-001" readonly />
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="text" value="2026-08-05" readonly />
      </div>
    </div>

    <div class="section-card">
      <div class="section-title"><i class="fa-regular fa-user"></i> Customer Information</div>
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" value="Preetham" />
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" value="+91 9876543210" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="text" value="customer@example.com" />
      </div>
      <div class="form-group">
        <label>Pickup Location</label>
        <input type="text" value="Manipal" />
      </div>
    </div>
  </div>

  <script>
    function downloadCrispPDF() {
      const element = document.getElementById('pdf-content');
      
      const opt = {
        margin:       [0.3, 0.3, 0.3, 0.3],
        filename:     'Quotation_Details.pdf',
        image:        { type: 'jpeg', quality: 1.0 },
        html2canvas:  { 
          scale: 4,                  /* 4x resolution blur complete open madute */
          useCORS: true, 
          logging: false,
          dpi: 300
        },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
