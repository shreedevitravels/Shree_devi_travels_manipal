<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coupon Code | Shree Devi Travels Manipal</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#000,#0f2027,#203a43);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:90%;max-width:450px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);padding:35px;border-radius:25px;text-align:center;box-shadow:0 0 30px rgba(0,198,255,.25)}
input,button{width:100%;padding:16px;border:none;border-radius:30px;margin-top:15px;font-size:16px;box-sizing:border-box}
button{background:linear-gradient(45deg,#00c6ff,#0072ff);color:#fff;font-weight:bold;cursor:pointer}
.home-btn{background:linear-gradient(45deg,#00c853,#00e676)}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:9999}
.popup-content{background:#fff;color:#000;padding:35px;border-radius:25px;width:85%;max-width:380px;text-align:center}
#detailsForm{display:none;margin-top:20px}
</style></head><body>
<div class="container">
<div style="font-size:60px">🎁</div>
<h1>Coupon Center</h1>
<p>Enter your special coupon code and unlock exclusive discounts from <b>Shree Devi Travels Manipal</b>.</p>
<input id="coupon" placeholder="Enter Coupon Code">
<button onclick="applyCoupon()">Apply Coupon</button>
<button class="home-btn" onclick="location.href='index.html'">🏠 Back To Home</button>
<div id="detailsForm">
<h2>🚖 Fill Your Details</h2>
<input id="name" placeholder="👤 Full Name">
<input id="phone" placeholder="📞 Phone Number">
<input id="pickup" placeholder="📍 Pickup Location">
<input id="drop" placeholder="🏁 Drop Location">
<button onclick="sendBooking()">Submit Booking</button>
</div></div>
<div class="popup" id="couponPopup"><div class="popup-content"><div style="font-size:60px">🎉</div><h2 style="color:#00c853">Congratulations!</h2><p>Coupon <b>PREETHU10</b> applied.<br>🎁 You unlocked <b>10% OFF</b>.</p><button onclick="closePopup()">Continue Booking 🚖</button></div></div>
<div class="popup" id="invalidPopup"><div class="popup-content"><div style="font-size:60px">❌</div><h2 style="color:#e53935">Invalid Coupon</h2><p>Please check the coupon code and try again.</p><button style="background:#e53935" onclick="invalidPopup.style.display='none'">Try Again</button></div></div>
<script>
function applyCoupon(){let c=coupon.value.trim().toUpperCase();if(c==="PREETHU10"){couponPopup.style.display="flex";}else{invalidPopup.style.display="flex";}}
function closePopup(){couponPopup.style.display="none";detailsForm.style.display="block";}
function sendBooking(){let n=name.value.trim(),p=phone.value.trim(),pu=pickup.value.trim(),d=drop.value.trim();if(!n||!p||!pu||!d){alert("Please fill all details");return;}
let msg=`🚖 Booking Request

Hello Shree Devi Travels Manipal,

I have successfully applied the coupon code and received a 10% discount.

Customer Details:
👤 Name: ${name}
📞 Phone: ${phone}
📍 Pickup Location: ${pickup}
🏁 Drop Location: ${drop}

🎁 Coupon Applied: PREETHU10 (10% OFF)

Kindly confirm the booking and share the fare details.

Thank you.`;

window.open(
"https://wa.me/916362635718?text=" + encodeURIComponent(msg),
"_blank"
);

}
</script></body></html>
